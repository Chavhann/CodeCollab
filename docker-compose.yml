services:
  postgres:
    image: postgres:16
    container_name: codecollab-postgres
    environment:
      POSTGRES_USER: codecollab
      POSTGRES_PASSWORD: codecollab
      POSTGRES_DB: codecollab
    ports:
      - "5432:5432"
    volumes:
      - codecollab_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: codecollab-redis
    ports:
      - "6379:6379"
    volumes:
      - codecollab_redis:/data

volumes:
  codecollab_postgres:
  codecollab_redis:
